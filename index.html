<style>
:root{
  /* The interface is grey on purpose. The films supply the colour. */
  --ink:#08090B;
  --panel:#0E1013;
  --raise:#15181D;
  --hair:#212630;
  --hair-lit:#333A46;
  --paper:#EFECE6;
  --dim:#858B96;
  --rec:#FF3B30;

  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;

  /* set by the "font" line in the settings block; these are the defaults */
  --hero-face:"XEB Anton",Impact,var(--sans);
  --hero-weight:400;
  --hero-track:-.012em;
  --head-face:"XEB Grotesk",var(--sans);
  --head-weight:700;
  --head-track:-.022em;

  --gut:clamp(18px,4.5vw,64px);
  --maxw:1340px;
}

/* ---------- the four font presets ----------
   "impact"    Anton for the big headline, Space Grotesk for the rest
   "grotesk"   Space Grotesk throughout
   "archivo"   Archivo throughout, the quietest of the four
   "editorial" Instrument Serif headline, Space Grotesk for the rest  */

html[data-font="grotesk"]{
  --hero-face:"XEB Grotesk",var(--sans);
  --hero-weight:700;
  --hero-track:-.03em;
}
html[data-font="archivo"]{
  --hero-face:"XEB Archivo",var(--sans);
  --hero-weight:700;
  --hero-track:-.034em;
  --head-face:"XEB Archivo",var(--sans);
  --head-track:-.026em;
}
html[data-font="editorial"]{
  --hero-face:"XEB Serif",Georgia,serif;
  --hero-weight:400;
  --hero-track:-.014em;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit}
img,video{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--paper);outline-offset:3px;border-radius:2px}

.shell{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut)}

/* stop the sticky bar covering a section when a nav link jumps to it */
#work,#services,#contact,#top{scroll-margin-top:72px}

/* ===================== top bar ===================== */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(8,9,11,.6);
  backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;
  transition:background .3s ease, border-color .3s ease;
}
.topbar.stuck{background:rgba(8,9,11,.9);border-bottom-color:var(--hair)}
.topbar-in{
  max-width:var(--maxw);margin:0 auto;padding:0 var(--gut);
  height:60px;display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.wordmark{
  display:flex;align-items:center;gap:9px;
  font-family:var(--head-face);
  font-weight:var(--head-weight);font-size:15px;letter-spacing:.05em;
  text-transform:uppercase;text-decoration:none;
}
.rec-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--rec);flex:none;
}
.topnav{display:flex;gap:26px;font-size:14px}
.topnav a{color:var(--dim);text-decoration:none}
.topnav a:hover{color:var(--paper)}

/* ===================== hero ===================== */
.hero{padding-top:clamp(46px,7vw,92px);padding-bottom:clamp(26px,3.5vw,42px)}
.hero-h1{
  font-family:var(--hero-face);
  font-size:clamp(40px,7vw,86px);
  font-weight:var(--hero-weight);
  line-height:1.02;
  letter-spacing:var(--hero-track);
  text-wrap:balance;
  margin:0 0 22px;
  max-width:17ch;
}
.hero-p{
  font-size:clamp(16px,1.75vw,20px);
  color:var(--dim);
  max-width:52ch;
  margin:0 0 30px;
}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}

.btn{
  display:inline-flex;align-items:center;
  font-size:14.5px;text-decoration:none;
  padding:11px 20px;border-radius:2px;
  border:1px solid var(--hair-lit);color:var(--paper);
  background:transparent;
  transition:background .16s ease,border-color .16s ease,color .16s ease;
}
.btn:hover{border-color:var(--paper)}
.btn--solid{background:var(--paper);color:#0A0B0D;border-color:var(--paper);font-weight:600}
.btn--solid:hover{background:#fff;color:#0A0B0D}

.tally{
  font-family:var(--mono);font-size:12.5px;color:var(--dim);
  display:flex;flex-wrap:wrap;gap:22px;
  padding-top:4px;
}
.tally span{color:var(--paper)}

/* ===================== hero reel strip ===================== */
.strip-wrap{
  margin-top:clamp(26px,4vw,46px);
  border-top:1px solid var(--hair);
  border-bottom:1px solid var(--hair);
  padding-block:16px;
  background:var(--panel);
}
.strip{
  max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut);
  display:flex;gap:12px;
  overflow-x:auto;
  scrollbar-width:thin;
  scrollbar-color:var(--hair-lit) transparent;
  -webkit-overflow-scrolling:touch;
}
.strip::-webkit-scrollbar{height:6px}
.strip::-webkit-scrollbar-thumb{background:var(--hair-lit);border-radius:3px}
.strip::-webkit-scrollbar-track{background:transparent}
.strip .tile{flex:0 0 clamp(126px,17vw,186px)}

/* ===================== the 9:16 tile ===================== */
.tile{
  padding:0;border:0;background:none;color:inherit;font:inherit;
  text-align:left;cursor:pointer;display:block;width:100%;
}
.frame{
  position:relative;
  aspect-ratio:9/16;
  overflow:hidden;
  background:var(--raise);
  border:1px solid var(--hair);
  border-radius:3px;
  transition:border-color .16s ease;
}
.tile:hover .frame{border-color:var(--hair-lit)}
.frame video{
  width:100%;height:100%;object-fit:cover;background:var(--raise);
  transition:transform .55s cubic-bezier(.22,.7,.3,1);
}
.tile:hover .frame video{transform:scale(1.045)}
.frame.missing video{visibility:hidden}

/* ---------- motion ----------
   .rv is added by script, never in the markup, so the page still
   shows everything if the script fails to run. */
.rv{
  opacity:0;transform:translateY(22px);
  transition:opacity .64s cubic-bezier(.22,.7,.3,1),
             transform .64s cubic-bezier(.22,.7,.3,1);
}
.rv.in{opacity:1;transform:none}

.miss{
  position:absolute;inset:8px;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:7px;
  text-align:center;padding:10px;
  border:1px dashed var(--hair-lit);border-radius:2px;
}
.frame.missing .miss{display:flex}
.miss b{font-size:11px;font-weight:600;color:var(--rec)}
.miss code{
  font-family:var(--mono);font-size:10.5px;line-height:1.5;
  color:var(--dim);word-break:break-all;
}

.tile-cap{padding:9px 1px 0}
.tile-t{font-size:13.5px;font-weight:600;line-height:1.3}
.tile-c{font-size:12.5px;color:var(--dim);line-height:1.35;margin-top:1px}

/* ===================== client bar ===================== */
.clients{
  border-bottom:1px solid var(--hair);
  padding-block:clamp(22px,3vw,34px);
}
.clients-in{
  display:flex;flex-wrap:wrap;gap:8px 34px;align-items:baseline;
}
.clients-lab{
  font-family:var(--mono);font-size:11.5px;color:var(--dim);
  flex:0 0 auto;
}
.clients-list{
  display:flex;flex-wrap:wrap;gap:6px 26px;
  font-size:14.5px;color:var(--paper);
}

/* ---------- the industries we work in ---------- */
.sectors{border-bottom:1px solid var(--hair);padding-block:clamp(22px,3vw,34px)}
.sectors-in{display:flex;flex-wrap:wrap;gap:12px 34px;align-items:baseline}
.sectors-list{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 320px}
.sectors-list span{
  font-size:13.5px;color:var(--dim);
  border:1px solid var(--hair);border-radius:999px;
  padding:5px 13px;
  transition:color .2s ease,border-color .2s ease;
}
/* the ones we have work to show for read brighter */
.sectors-list span.has{color:var(--paper);border-color:var(--hair-lit)}

/* ===================== industry bands ===================== */
.band{
  border-bottom:1px solid var(--hair);
  padding-block:clamp(34px,5vw,62px);
}
.band-in{
  display:grid;
  grid-template-columns:minmax(0,258px) minmax(0,1fr);
  gap:clamp(20px,3.5vw,50px);
  align-items:start;
}
.band-side{position:sticky;top:84px}
.band-n{
  font-family:var(--head-face);
  font-size:clamp(22px,2.6vw,30px);
  font-weight:var(--head-weight);letter-spacing:var(--head-track);line-height:1.14;
  margin:0 0 10px;
}
.band-b{font-size:14px;color:var(--dim);margin:0 0 14px;max-width:34ch}
.band-c{font-family:var(--mono);font-size:11.5px;color:var(--dim)}

/* Fixed tile width, so a band with one film reads the same as a band
   with eight instead of stretching to fill the row. */
.band-grid{
  display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(150px,182px));
}

.section-head{
  padding-block:clamp(30px,4vw,52px) 0;
}
.section-t{
  font-size:clamp(13px,1.4vw,14px);
  font-family:var(--mono);color:var(--dim);
  margin:0 0 6px;
}
.section-h{
  font-family:var(--head-face);
  font-size:clamp(27px,3.7vw,44px);
  font-weight:var(--head-weight);letter-spacing:var(--head-track);line-height:1.06;
  margin:0;max-width:20ch;
}

/* ===================== services ===================== */
.svc-wrap{padding-block:clamp(34px,5vw,64px);border-bottom:1px solid var(--hair)}
.svc{
  display:grid;gap:30px 40px;
  grid-template-columns:repeat(auto-fit,minmax(224px,1fr));
  margin-top:clamp(24px,3vw,38px);
}
.svc-n{font-family:var(--head-face);font-size:17px;font-weight:var(--head-weight);letter-spacing:-.012em;margin:0 0 6px}
.svc-d{font-size:14px;color:var(--dim);margin:0;max-width:36ch}

/* ===================== contact ===================== */
.contact{padding-block:clamp(40px,6vw,80px)}
.contact-in{
  display:grid;gap:clamp(26px,4vw,60px);
  grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
  align-items:start;
}
.contact-h{
  font-family:var(--head-face);
  font-size:clamp(28px,3.9vw,48px);
  font-weight:var(--head-weight);letter-spacing:var(--head-track);line-height:1.06;
  margin:0 0 18px;max-width:16ch;
}
.contact-p{font-size:15.5px;color:var(--dim);margin:0;max-width:44ch}

.card{
  border:1px solid var(--hair);border-radius:3px;
  background:var(--panel);padding:clamp(20px,2.4vw,28px);
}
.card-n{font-family:var(--head-face);font-size:19px;font-weight:var(--head-weight);letter-spacing:-.01em;margin:0}
.card-r{font-size:13.5px;color:var(--dim);margin:2px 0 18px}
.card-rows{display:grid;gap:0}
.card-rows a{
  display:block;text-decoration:none;font-size:15px;
  padding:12px 0;border-top:1px solid var(--hair);
  transition:color .16s ease;
}
.card-rows a:hover{color:var(--rec)}
.foot{
  border-top:1px solid var(--hair);
  padding-block:22px;
  display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;
  font-family:var(--mono);font-size:11.5px;color:var(--dim);
}

/* ===================== lightbox ===================== */
.lb{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(5,6,8,.97);
  backdrop-filter:blur(10px);
  padding:clamp(14px,3vw,40px);
  opacity:0;
  transition:opacity .26s ease;
}
.lb.on{display:flex;align-items:center;justify-content:center;gap:clamp(18px,3vw,44px);flex-wrap:wrap}
.lb.shown{opacity:1}
/* a fixed 9:16 box, so the frame has a known size before the video
   loads and the open animation can measure it */
.lb-v{
  aspect-ratio:9/16;
  height:min(84vh,760px);
  width:auto;max-width:86vw;
  object-fit:contain;
  border-radius:4px;background:#000;border:1px solid var(--hair);
  will-change:transform;
}
/* the text panel arrives just after the frame has landed */
.lb-i{
  opacity:0;transform:translateY(14px);
  transition:opacity .34s ease .14s, transform .34s ease .14s;
}
.lb.shown .lb-i{opacity:1;transform:none}
.lb-i{max-width:300px;min-width:230px}
.lb-t{font-family:var(--head-face);font-size:25px;font-weight:var(--head-weight);letter-spacing:var(--head-track);margin:0 0 3px}
.lb-c{font-size:14.5px;color:var(--paper);margin:0 0 12px}
.lb-d{font-size:14px;color:var(--dim);margin:0 0 20px}
.lb-nav{display:flex;gap:8px;margin-top:16px}
.lb-btn{
  font:inherit;font-size:13.5px;cursor:pointer;
  padding:9px 15px;border-radius:2px;
  background:transparent;border:1px solid var(--hair-lit);color:var(--paper);
}
.lb-btn:hover{border-color:var(--paper)}
.lb-x{
  position:absolute;top:14px;right:16px;
  font:inherit;font-size:26px;line-height:1;cursor:pointer;
  background:none;border:0;color:var(--dim);padding:8px;
}
.lb-x:hover{color:var(--paper)}
.gone{display:none !important}

/* ===================== responsive ===================== */
@media (max-width:900px){
  .band-in{grid-template-columns:1fr;gap:20px}
  .band-side{position:static}
  .contact-in{grid-template-columns:1fr}
  .topnav{gap:18px;font-size:13px}
}
@media (max-width:560px){
  .band-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .topnav a:first-child{display:none}
  .lb.on{gap:16px}
  .lb-v{max-height:62vh}
  .lb-i{min-width:0;max-width:100%}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none !important;animation:none !important}
}

<body>

      <button class="lb-btn" id="lbnext">Next</button>
    </div>

</div>

<script>
(function(){
  "use strict";

  var D = (typeof XEB !== "undefined") ? XEB : null;
  if (!D){
    document.body.innerHTML =
      '<div style="font:16px/1.6 -apple-system,sans-serif;color:#EFECE6;padding:48px;max-width:46ch">' +
      '<h1 style="font-weight:800;letter-spacing:-.03em">Settings block not found</h1>' +
      '<p style="color:#858B96">The block at the top of index.html is missing or has a typo in it. ' +
      'Open the file in a text editor and check the part between DATA-START and DATA-END. It is ' +
      'almost always a missing comma or an unclosed quote mark.</p></div>';
    return;
  }

  var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function el(t,c){ var n=document.createElement(t); if(c) n.className=c; return n; }

  /* ---------------------------------------------------------------
     Scroll reveal.
     The .rv class is only ever added by this script, so if the
     script fails the page still renders everything visible.
     --------------------------------------------------------------- */
  var watcher = null;
  if (!calm && "IntersectionObserver" in window){
    watcher = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        e.target.classList.add("in");
        watcher.unobserve(e.target);
      });
    }, { threshold: 0.08, rootMargin: "0px 0px -50px 0px" });
  }

  function reveal(node, delay){
    if (!watcher || !node) return;
    node.classList.add("rv");
    if (delay) node.style.transitionDelay = delay + "ms";
    watcher.observe(node);
  }

  /* ---------------------------------------------------------------
     File-name resolution.
     Windows often hides file extensions, so a file shown as
     "QSasked" may really be "QSasked.mp4", and one shown as
     "Clip.mp4" may really be "Clip.mp4.mp4". We try each spelling
     in turn and keep whichever the browser can actually open.
     --------------------------------------------------------------- */
  var EXT = /\.(mp4|mov|m4v|webm)$/i;

  function candidates(raw){
    var list = [];
    if (EXT.test(raw)){
      list.push(raw);
      list.push(raw + ".mp4");
      list.push(raw.replace(/\.[^.]+$/, ""));
    } else {
      list.push(raw + ".mp4");
      list.push(raw);
      list.push(raw + ".MP4");
      list.push(raw + ".mov");
      list.push(raw + ".webm");
    }
    var seen = {}, out = [];
    list.forEach(function(n){ if(!seen[n]){ seen[n]=1; out.push(n); } });
    return out;
  }

  function url(base, name){
    return base + name.split("/").map(encodeURIComponent).join("/");
  }

  /* Remember which spelling worked, so the lightbox doesn't retry. */
  var resolved = {};

  function attach(video, item, onFail){
    var names = candidates(item.file), i = 0;
    if (resolved[item.file]){
      video.src = resolved[item.file];
      return;
    }
    function tryNext(){
      if (i >= names.length){ if (onFail) onFail(names); return; }
      video.src = url(D.videoBase, names[i++]);
    }
    video.addEventListener("error", tryNext);
    video.addEventListener("loadeddata", function(){
      resolved[item.file] = video.currentSrc || video.src;
    });
    tryNext();
  }

  /* ---------------------------------------------------------------
     Build one 9:16 tile.
     --------------------------------------------------------------- */
  var lazy = [];

  function tile(item, autoplay){
    var btn = el("button","tile");
    btn.type = "button";

    var frame = el("div","frame");
    var v = document.createElement("video");
    v.muted = true; v.loop = true; v.playsInline = true;
    v.setAttribute("muted",""); v.setAttribute("playsinline","");
    v.preload = "metadata";

    if (item.poster) v.poster = D.posterBase + item.poster;

    var miss = el("div","miss");
    var mb = el("b"); mb.textContent = "File not found";
    var mc = document.createElement("code");
    miss.appendChild(mb); miss.appendChild(mc);

    frame.appendChild(v); frame.appendChild(miss);

    var load = function(){
      load = function(){};
      attach(v, item, function(names){
        frame.classList.add("missing");
        mc.textContent = "videos/" + names[0];
      });
      if (autoplay && !calm){
        v.autoplay = true;
        var go = v.play(); if (go && go.catch) go.catch(function(){});
      }
    };

    if (autoplay) load(); else lazy.push({ node: btn, load: load });

    var cap = el("div","tile-cap");
    var t = el("div","tile-t"); t.textContent = item.title || item.client;
    var c = el("div","tile-c"); c.textContent = item.client;
    cap.appendChild(t); cap.appendChild(c);

    btn.appendChild(frame); btn.appendChild(cap);

    btn.addEventListener("mouseenter", function(){
      if (calm) return;
      load();
      var go = v.play(); if (go && go.catch) go.catch(function(){});
    });
    btn.addEventListener("mouseleave", function(){
      if (autoplay) return;
      v.pause(); try { v.currentTime = 0; } catch(e){}
    });

  /* Only load video data for tiles near the viewport. */
  if ("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var hit = lazy.filter(function(x){ return x.node === e.target; })[0];
        if (hit) hit.load();
        io.unobserve(e.target);
      });
    }, { rootMargin: "400px 0px" });
    setTimeout(function(){ lazy.forEach(function(x){ io.observe(x.node); }); }, 0);
  } else {
    setTimeout(function(){ lazy.forEach(function(x){ x.load(); }); }, 0);
  }

  /* ---------------------------------------------------------------
     Header, hero, tallies
     --------------------------------------------------------------- */
  document.title = D.studio;
  document.getElementById("wm").textContent = D.studio;
  document.getElementById("h1").textContent = D.headline;
  document.getElementById("sf").textContent = D.standfirst;
  document.getElementById("pitch").textContent = D.contact.pitch;

  var acts = document.getElementById("acts");
  var a1 = el("a","btn btn--solid"); a1.href = "#work"; a1.textContent = "See the work";
  acts.appendChild(a1);
  if (D.contact.phone){
    var tel = D.contact.phone.replace(/[^\d+]/g,"");
    var a2 = el("a","btn"); a2.href = "https://wa.me/" + tel.replace(/^\+/,"");
    a2.target = "_blank"; a2.rel = "noopener"; a2.textContent = "WhatsApp";
    acts.appendChild(a2);
    var a3 = el("a","btn"); a3.href = "tel:" + tel; a3.textContent = D.contact.phone;
    acts.appendChild(a3);
  }

  var clientNames = [];
  D.work.forEach(function(w){
    if (clientNames.indexOf(w.client) === -1) clientNames.push(w.client);
  });
  var usedInd = D.industries.filter(function(ind){
    return D.work.some(function(w){ return w.industry === ind.id; });
  });

  var tally = document.getElementById("tally");
  (D.claims || []).forEach(function(text){
    var d = el("div"); d.textContent = text; tally.appendChild(d);
  });

  var cl = document.getElementById("clients");
  clientNames.forEach(function(n){
    var s = el("span"); s.textContent = n; cl.appendChild(s);
  });

    var opening = [
      document.getElementById("h1"),
      document.getElementById("sf"),
      acts,

      n.style.transitionDelay = (80 + i * 95) + "ms";

      requestAnimationFrame(function(){
        opening.forEach(function(n){ n.classList.add("in"); });
      });
    });
  }
  /* every industry is listed; the ones with films on the page are
     highlighted, the rest still show that the studio covers them */
  var sect = document.getElementById("sectors");
  D.industries.forEach(function(ind){
    var s = el("span");
    s.textContent = ind.name;
    if (usedInd.indexOf(ind) > -1) s.className = "has";
    sect.appendChild(s);
  });

  reveal(document.querySelector(".clients-in"));
  reveal(document.querySelector(".sectors-in"));

  /* set the heading typeface chosen in the settings block */
  var picks = ["impact","grotesk","archivo","editorial"];
  document.documentElement.setAttribute(
    "data-font", picks.indexOf(D.font) > -1 ? D.font : "impact");

  /* ---------------------------------------------------------------
     Hero strip
     --------------------------------------------------------------- */
  var heroes = D.work.filter(function(w){ return w.hero; });
  if (heroes.length < 4) heroes = D.work.slice(0, 5);
  var strip = document.getElementById("strip");
  heroes.forEach(function(w){ strip.appendChild(tile(w, true)); });

  /* ---------------------------------------------------------------
     Industry bands
     --------------------------------------------------------------- */
  var order = [];
  var bands = document.getElementById("bands");

  usedInd.forEach(function(ind){
    var items = D.work.filter(function(w){ return w.industry === ind.id; });

    var sec = el("section","band");
    var shell = el("div","shell");
    var inner = el("div","band-in");

    var side = el("div","band-side");
    var h = el("h3","band-n"); h.textContent = ind.name;
    var b = el("p","band-b"); b.textContent = ind.blurb || "";
    var c = el("p","band-c");
    c.textContent = items.length + (items.length === 1 ? " film" : " films");
    side.appendChild(h); side.appendChild(b); side.appendChild(c);

    reveal(side);

    var grid = el("div","band-grid");
    items.forEach(function(w, i){
      order.push(w);
      var node = tile(w, false);
      grid.appendChild(node);
      reveal(node, (i % 5) * 60);   /* stagger across each row */
    });

    inner.appendChild(side); inner.appendChild(grid);
    shell.appendChild(inner); sec.appendChild(shell);
    bands.appendChild(sec);
  });

  /* ---------------------------------------------------------------
     Services
     --------------------------------------------------------------- */
  var svc = document.getElementById("svc");
  (D.services || []).forEach(function(s, i){
    var d = el("div");
    var n = el("p","svc-n"); n.textContent = s.name;
    var x = el("p","svc-d"); x.textContent = s.detail;
    d.appendChild(n); d.appendChild(x); svc.appendChild(d);
    reveal(d, (i % 3) * 70);
  });

  document.querySelectorAll(".section-head, .svc-wrap > .section-t, .svc-wrap > .section-h")
    .forEach(function(n){ reveal(n); });
  reveal(document.querySelector(".contact-in > div"));
  reveal(document.querySelector(".contact-in .card"), 110);

  /* ---------------------------------------------------------------
     Contact card
     --------------------------------------------------------------- */
  document.getElementById("cn").textContent = D.contact.name || "";
  document.getElementById("cr").textContent = D.contact.role || "";

  var rows = document.getElementById("crows");
  function row(label, href){
    if (!label || !href) return;
    var a = el("a"); a.href = href; a.textContent = label;
    if (href.indexOf("http") === 0){ a.target = "_blank"; a.rel = "noopener"; }
    rows.appendChild(a);
  }
  if (D.contact.phone) row(D.contact.phone, "tel:" + D.contact.phone.replace(/[^\d+]/g,""));
  if (D.contact.email) row(D.contact.email, "mailto:" + D.contact.email);

  if (D.contact.showStudioEmails && D.contact.studioEmails){
    D.contact.studioEmails.forEach(function(e){ row(e, "mailto:" + e); });
  }

  /* the bar only grows a border once the page has moved */
  var bar = document.querySelector(".topbar");
  var ticking = false;
  window.addEventListener("scroll", function(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      bar.classList.toggle("stuck", window.scrollY > 24);
      ticking = false;
    });
  }, { passive: true });

  var foot = document.getElementById("foot");
  var f1 = el("div"); f1.textContent = D.studio + " " + new Date().getFullYear();
  var f2 = el("div"); f2.textContent = "Islamabad, Pakistan";
  foot.appendChild(f1); foot.appendChild(f2);

  /* ---------------------------------------------------------------
     Lightbox
     --------------------------------------------------------------- */
  var lb    = document.getElementById("lb");
  var lbv   = document.getElementById("lbv");
  var lbl   = document.getElementById("lbl");
  var idx   = -1;
  var opener = null;

  var closeTimer = null;

  /* Grow the player out of the tile that was clicked: measure the tile,
     start the player at that exact position and size, then release it.
     Skipped entirely when the visitor asks for reduced motion. */
  function growFrom(rect){
    if (calm || !rect || !rect.width) return;
    var to = lbv.getBoundingClientRect();
    if (!to.width) return;
    var dx = (rect.left + rect.width / 2)  - (to.left + to.width / 2);
    var dy = (rect.top  + rect.height / 2) - (to.top  + to.height / 2);
    var sc = rect.width / to.width;
    lbv.style.transition = "none";
    lbv.style.transform  = "translate(" + dx + "px," + dy + "px) scale(" + sc + ")";
    void lbv.offsetWidth;                       /* force the browser to apply it */
    lbv.style.transition = "transform .44s cubic-bezier(.2,.8,.25,1)";
    lbv.style.transform  = "translate(0,0) scale(1)";
  }

  function openLb(item, from){
    if (from) opener = from;
    idx = order.indexOf(item);

    clearTimeout(closeTimer);
    var startRect = null;
    if (from){
      var f = from.querySelector(".frame");
      if (f) startRect = f.getBoundingClientRect();
    }

    lbv.removeAttribute("src");
    if (item.poster) lbv.poster = D.posterBase + item.poster;
    else lbv.removeAttribute("poster");
    attach(lbv, item, function(){});

    document.getElementById("lbt").textContent = item.title || item.client;
    document.getElementById("lbc").textContent =
      item.client + (item.handle ? "  " + item.handle : "");
    document.getElementById("lbd").textContent = item.did || "";

    if (item.link){
      lbl.href = item.link;
      lbl.textContent = item.link.indexOf("youtu") > -1 ? "Watch on YouTube" : "Watch on Instagram";
      lbl.classList.remove("gone");
    } else {
      lbl.classList.add("gone");
    }

    document.getElementById("lbprev").disabled = (idx <= 0);
    document.getElementById("lbnext").disabled = (idx < 0 || idx >= order.length - 1);

    lb.classList.add("on");
    document.body.style.overflow = "hidden";

    if (startRect) growFrom(startRect);
    else { lbv.style.transition = "none"; lbv.style.transform = "none"; }

    requestAnimationFrame(function(){ lb.classList.add("shown"); });

    var go = lbv.play(); if (go && go.catch) go.catch(function(){});
    document.getElementById("lbx").focus();
  }

  function step(n){
    if (idx < 0) return;
    var next = idx + n;
    if (next < 0 || next >= order.length) return;
    openLb(order[next], null);
  }

  /* Shrink back into the tile it came from, as long as that tile is
     still on screen. Otherwise just fade out. */
  function shutLb(){
    var frame = opener ? opener.querySelector(".frame") : null;
    var r = frame ? frame.getBoundingClientRect() : null;
    var onScreen = r && r.bottom > 0 && r.top < window.innerHeight;

    if (!calm && onScreen){
      var from = lbv.getBoundingClientRect();
      var dx = (r.left + r.width / 2)  - (from.left + from.width / 2);
      var dy = (r.top  + r.height / 2) - (from.top  + from.height / 2);
      var sc = r.width / from.width;
      lbv.style.transition = "transform .32s cubic-bezier(.4,0,.6,1)";
      lbv.style.transform  = "translate(" + dx + "px," + dy + "px) scale(" + sc + ")";
    }

    lb.classList.remove("shown");
    lbv.pause();

    clearTimeout(closeTimer);
    closeTimer = setTimeout(function(){
      lb.classList.remove("on");
      lbv.removeAttribute("src"); lbv.load();
      lbv.style.transition = "none";
      lbv.style.transform  = "none";
      document.body.style.overflow = "";
      if (opener) opener.focus();
    }, calm ? 0 : 300);
  }

  document.getElementById("lbx").addEventListener("click", shutLb);
  document.getElementById("lbprev").addEventListener("click", function(){ step(-1); });
  document.getElementById("lbnext").addEventListener("click", function(){ step(1); });
  lb.addEventListener("click", function(e){ if (e.target === lb) shutLb(); });
  document.addEventListener("keydown", function(e){
    if (!lb.classList.contains("on")) return;
    if (e.key === "Escape")     shutLb();
    if (e.key === "ArrowLeft")  step(-1);
    if (e.key === "ArrowRight") step(1);
  });
})();
</script>
</body>
</html>
